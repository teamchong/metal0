        timeout-minutes: 60

  test-cpython-windows:
    name: CPython @windows (85 tests)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/build-cpython
        with:
