          label: "core6"
          os: "linux"
        timeout-minutes: 45

  test-metal0-linux:
    name: Metal0 @linux (28 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
