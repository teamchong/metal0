          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Tests failed: $FAILED/$TOTAL"
            exit 1
          fi
        timeout-minutes: 60

  test-cpython-macos:
    name: CPython @macos (25 tests)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python 3.13.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"

      - name: Run CPython macOS-specific tests
        run: |
          cd tests/cpython
          # Set locale to C to avoid locale-dependent test failures (e.g., test_datetime %c format)
          export LC_ALL=C
          PASSED=0; FAILED=0; TOTAL=0
          while IFS= read -r test || [ -n "$test" ]; do
            [ -z "$test" ] && continue
            TOTAL=$((TOTAL + 1))
            # Use Python's built-in test module
            # Check output for SUCCESS instead of exit code (some tests return non-zero even when passing)
            OUTPUT=$(python3 -m test test_${test} 2>&1) || true
            echo "$OUTPUT"
            # Match SUCCESS or NO TESTS RAN (skipped tests are not failures)
            if echo "$OUTPUT" | grep -qE "(Tests result: SUCCESS|Result: SUCCESS|Result: NO TESTS RAN)"; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done < ../groups/macos.txt
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          echo "## 📊 CPython Test Results - @macos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Tests failed: $FAILED/$TOTAL"
            exit 1
          fi
        timeout-minutes: 60

  test-cpython-windows:
    name: CPython @windows (85 tests)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python 3.13.11 (Windows uses pre-built binary)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"

      - name: Run CPython Windows-specific tests
        shell: pwsh
        run: |
          Set-Location tests/cpython
          $passed = 0; $failed = 0; $total = 0
          Get-Content ../groups/windows.txt | ForEach-Object {
            $test = $_.Trim()
            if ($test -eq "") { return }
            $total++
            # Use Python's built-in test module
            # Check output for SUCCESS instead of exit code (some tests return non-zero even when passing)
            $output = python -m test "test_$test" 2>&1 | Out-String
            Write-Host $output
            # Match SUCCESS or NO TESTS RAN (skipped tests are not failures)
            if ($output -match "(Tests result: SUCCESS|Result: SUCCESS|Result: NO TESTS RAN)") {
              $passed++
            } else {
              $failed++
            }
          }
          $rate = if ($total -gt 0) { [math]::Round(($passed / $total) * 100, 1) } else { 0 }

          "## 📊 CPython Test Results - @windows" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| Metric | Value |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "|--------|-------|" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ✅ Passed | $passed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ❌ Failed | $failed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📋 Total | $total |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📈 Pass Rate | ${rate}% |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

          if ($failed -gt 0) { exit 1 }
        timeout-minutes: 60
