          label: "linux"
          os: "linux"
        timeout-minutes: 60

  test-cpython-macos:
    name: CPython @macos (25 tests)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/build-cpython
        with:
          os: "macos"
