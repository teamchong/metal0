  test-cpython-linux:
    name: CPython @linux (28 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/build-cpython
        with:
