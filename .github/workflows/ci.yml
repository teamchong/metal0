          commit: ${{ env.CPYTHON_COMMIT }}
      - uses: ./.github/actions/run-cpython-tests
        with:
          group: "windows"
          label: "windows"
          os: "windows"
        timeout-minutes: 60

  # =============================================================================
  # NumPy External Library Tests
  # Tests numpy array/ufunc behaviors using upstream test suite
  # =============================================================================

  test-numpy-core:
    name: NumPy _core Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - uses: ./.github/actions/run-extlib-tests
        with:
          library: "numpy"
          test_dir: "tests/numpy/_core"
          fail_on_error: "false"
        timeout-minutes: 45

  test-numpy-linalg:
