name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.15.2"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # CPython Compatibility Tests (Platform-specific)
  # =============================================================================
  test-cpython-core:
    name: CPython @core (286 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Run platform-independent CPython tests
        id: test-core
        run: |
          ./zig-out/bin/metal0 test tests/cpython @core 2>&1 | tee test_output.txt || true
          # Parse results
          PASSED=$(grep -oE '[0-9]+ passed' test_output.txt | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test_output.txt | head -1 | grep -oE '[0-9]+' || echo "0")
          TOTAL=$((PASSED + FAILED))
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          # Always write summary
          echo "## 📊 Test Results - @core" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          # Exit with failure if any tests failed
          [ "$FAILED" -gt 0 ] && exit 1 || true
        timeout-minutes: 60

  test-cpython-linux:
    name: CPython @linux (18 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Run Linux-specific CPython tests
        id: test-linux
        run: |
          ./zig-out/bin/metal0 test tests/cpython @linux 2>&1 | tee test_output.txt || true
          # Parse results
          PASSED=$(grep -oE '[0-9]+ passed' test_output.txt | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test_output.txt | head -1 | grep -oE '[0-9]+' || echo "0")
          TOTAL=$((PASSED + FAILED))
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          # Always write summary
          echo "## 📊 Test Results - @linux" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          # Exit with failure if any tests failed
          [ "$FAILED" -gt 0 ] && exit 1 || true
        timeout-minutes: 60

  test-cpython-macos:
    name: CPython @macos (25 tests)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Run macOS-specific CPython tests
        id: test-macos
        run: |
          ./zig-out/bin/metal0 test tests/cpython @macos 2>&1 | tee test_output.txt || true
          # Parse results
          PASSED=$(grep -oE '[0-9]+ passed' test_output.txt | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test_output.txt | head -1 | grep -oE '[0-9]+' || echo "0")
          TOTAL=$((PASSED + FAILED))
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          # Always write summary
          echo "## 📊 Test Results - @macos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          # Exit with failure if any tests failed
          [ "$FAILED" -gt 0 ] && exit 1 || true
        timeout-minutes: 60

  test-cpython-windows:
    name: CPython @windows (93 tests)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Run Windows-specific CPython tests
        id: test-windows
        shell: pwsh
        run: |
          try {
            & .\zig-out\bin\metal0.exe test tests/cpython @windows 2>&1 | Tee-Object -FilePath test_output.txt
          } catch {
            # Test command failed, but continue to show summary
          }

          # Parse results - always show summary
          $passed = 0
          $failed = 0
          if (Test-Path test_output.txt) {
            $content = Get-Content test_output.txt -Raw
            $passedMatch = [regex]::Match($content, '(\d+) passed')
            $failedMatch = [regex]::Match($content, '(\d+) failed')
            $passed = if ($passedMatch.Success) { [int]$passedMatch.Groups[1].Value } else { 0 }
            $failed = if ($failedMatch.Success) { [int]$failedMatch.Groups[1].Value } else { 0 }
          }
          $total = $passed + $failed
          $rate = if ($total -gt 0) { [math]::Round(($passed / $total) * 100, 1) } else { 0 }

          # Always write summary
          "## 📊 Test Results - @windows" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| Metric | Value |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "|--------|-------|" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ✅ Passed | $passed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ❌ Failed | $failed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📋 Total | $total |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📈 Pass Rate | ${rate}% |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

          # Exit with failure if tests failed
          if ($failed -gt 0) { exit 1 }
        timeout-minutes: 60
