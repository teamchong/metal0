name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.15.2"
  CPYTHON_COMMIT: "067145177975eadd61a0c907d0d177f7b6a5a3de"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Metal0 Compiled Tests (Python -> Zig -> Native Binary)
  # Split into 6 core groups (~45 tests each) for CI runners with 2 vCPU
  # =============================================================================

  test-metal0-core1:
    name: Metal0 @core1 (46 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@core1"
          label: "core1"
          os: "linux"
        timeout-minutes: 45

  test-metal0-core2:
    name: Metal0 @core2 (46 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@core2"
          label: "core2"
          os: "linux"
        timeout-minutes: 45

  test-metal0-core3:
    name: Metal0 @core3 (46 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@core3"
          label: "core3"
          os: "linux"
        timeout-minutes: 45

  test-metal0-core4:
    name: Metal0 @core4 (46 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@core4"
          label: "core4"
          os: "linux"
        timeout-minutes: 45

  test-metal0-core5:
    name: Metal0 @core5 (46 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@core5"
          label: "core5"
          os: "linux"
        timeout-minutes: 45

  test-metal0-core6:
    name: Metal0 @core6 (51 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
