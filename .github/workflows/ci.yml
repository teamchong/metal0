      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@linux"
          label: "linux"
          os: "linux"
        timeout-minutes: 60

  test-metal0-macos:
    name: Metal0 @macos (25 tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@macos"
          label: "macos"
          os: "macos"
        timeout-minutes: 60

  test-metal0-windows:
    name: Metal0 @windows (85 tests)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -freference-trace=20
      - uses: ./.github/actions/run-metal0-tests
        with:
          group: "@windows"
          label: "windows"
          os: "windows"
        timeout-minutes: 60

  # =============================================================================
  # CPython Reference Tests (Run test files with Python interpreter)
  # =============================================================================

  test-cpython-core1:
    name: CPython @core1 (46 tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"
      - uses: ./.github/actions/run-cpython-tests
        with:
          group: "core1"
          label: "core1"
          os: "linux"
        timeout-minutes: 30

