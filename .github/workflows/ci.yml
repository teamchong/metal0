        timeout-minutes: 60

  test-metal0-macos:
    name: Metal0 @macos (25 tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: goto-bus-stop/setup-zig@v2
        with:
