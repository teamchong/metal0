name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.15.2"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # CPython Compatibility Tests (Platform-specific)
  # =============================================================================
  test-cpython-core:
    name: CPython @core (286 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Run platform-independent CPython tests
        id: test-core
        run: |
          ./zig-out/bin/metal0 test tests/cpython @core 2>&1 | tee test_output.txt || true
          echo "=== DEBUG: Last 20 lines of output ===" >&2
          tail -20 test_output.txt >&2
          # Strip ANSI color codes for parsing
          sed 's/\x1b\[[0-9;]*m//g' test_output.txt > test_output_clean.txt
          echo "=== DEBUG: Looking for Results/passed ===" >&2
          grep -E "Results:|passed" test_output_clean.txt | tail -5 >&2 || echo "NO MATCH" >&2
          # Parse results from "Results: X/Y passed (Z%)" or "All N tests passed!"
          if grep -q "All.*tests passed" test_output_clean.txt; then
            PASSED=$(grep -oE 'All [0-9]+ tests passed' test_output_clean.txt | grep -oE '[0-9]+' | head -1)
            PASSED=${PASSED:-0}
            FAILED=0
            TOTAL=$PASSED
          else
            PASSED=$(grep -oE '[0-9]+/[0-9]+ passed' test_output_clean.txt | head -1 | cut -d'/' -f1)
            TOTAL=$(grep -oE '[0-9]+/[0-9]+ passed' test_output_clean.txt | head -1 | cut -d'/' -f2 | cut -d' ' -f1)
            PASSED=${PASSED:-0}
            TOTAL=${TOTAL:-0}
            FAILED=$((TOTAL - PASSED))
          fi
          echo "=== DEBUG: PASSED=$PASSED TOTAL=$TOTAL FAILED=$FAILED ===" >&2
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          # Always write summary
          echo "## 📊 Test Results - @core" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          # Exit with failure if any tests failed
          [ "$FAILED" -gt 0 ] && exit 1 || true
        timeout-minutes: 60

  test-cpython-linux:
    name: CPython @linux (18 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -freference-trace=20 -fno-error-limit 2>&1 | head -200 || true

      - name: Run Linux-specific CPython tests
        id: test-linux
        run: |
          ./zig-out/bin/metal0 test tests/cpython @linux 2>&1 | tee test_output.txt || true
          # Strip ANSI color codes for parsing
          sed 's/\x1b\[[0-9;]*m//g' test_output.txt > test_output_clean.txt
          # Parse results from "Results: X/Y passed (Z%)" or "All N tests passed!"
          if grep -q "All.*tests passed" test_output_clean.txt; then
            PASSED=$(grep -oE 'All [0-9]+ tests passed' test_output_clean.txt | grep -oE '[0-9]+' | head -1)
            PASSED=${PASSED:-0}
            FAILED=0
            TOTAL=$PASSED
          else
            PASSED=$(grep -oE '[0-9]+/[0-9]+ passed' test_output_clean.txt | head -1 | cut -d'/' -f1)
            TOTAL=$(grep -oE '[0-9]+/[0-9]+ passed' test_output_clean.txt | head -1 | cut -d'/' -f2 | cut -d' ' -f1)
            PASSED=${PASSED:-0}
            TOTAL=${TOTAL:-0}
            FAILED=$((TOTAL - PASSED))
          fi
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          # Always write summary
          echo "## 📊 Test Results - @linux" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          # Exit with failure if any tests failed
          [ "$FAILED" -gt 0 ] && exit 1 || true
        timeout-minutes: 60

  test-cpython-macos:
    name: CPython @macos (25 tests)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Run macOS-specific CPython tests
        id: test-macos
        run: |
          ./zig-out/bin/metal0 test tests/cpython @macos 2>&1 | tee test_output.txt || true
          # Strip ANSI color codes for parsing
          sed 's/\x1b\[[0-9;]*m//g' test_output.txt > test_output_clean.txt
          # Parse results from "Results: X/Y passed (Z%)" or "All N tests passed!"
          if grep -q "All.*tests passed" test_output_clean.txt; then
            PASSED=$(grep -oE 'All [0-9]+ tests passed' test_output_clean.txt | grep -oE '[0-9]+' | head -1)
            PASSED=${PASSED:-0}
            FAILED=0
            TOTAL=$PASSED
          else
            PASSED=$(grep -oE '[0-9]+/[0-9]+ passed' test_output_clean.txt | head -1 | cut -d'/' -f1)
            TOTAL=$(grep -oE '[0-9]+/[0-9]+ passed' test_output_clean.txt | head -1 | cut -d'/' -f2 | cut -d' ' -f1)
            PASSED=${PASSED:-0}
            TOTAL=${TOTAL:-0}
            FAILED=$((TOTAL - PASSED))
          fi
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          # Always write summary
          echo "## 📊 Test Results - @macos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          # Exit with failure if any tests failed
          [ "$FAILED" -gt 0 ] && exit 1 || true
        timeout-minutes: 60

  test-cpython-windows:
    name: CPython @windows (93 tests)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -freference-trace=20

      - name: Run Windows-specific CPython tests
        id: test-windows
        shell: pwsh
        run: |
          & .\zig-out\bin\metal0.exe test tests/cpython @windows 2>&1 | Tee-Object -FilePath test_output.txt
          $exitCode = $LASTEXITCODE

          # Strip ANSI color codes for parsing (PowerShell regex)
          $content = Get-Content test_output.txt -Raw
          if ($null -eq $content) { $content = "" }
          $content = $content -replace '\x1b\[[0-9;]*m', ''

          # Parse results from "Results: X/Y passed (Z%)" or "All N tests passed!"
          if ($content -match 'All (\d+) tests passed') {
            $passed = [int]$Matches[1]
            $failed = 0
            $total = $passed
          } elseif ($content -match '(\d+)/(\d+) passed') {
            $passed = [int]$Matches[1]
            $total = [int]$Matches[2]
            $failed = $total - $passed
          } else {
            $passed = 0
            $failed = 0
            $total = 0
          }
          $rate = if ($total -gt 0) { [math]::Round(($passed / $total) * 100, 1) } else { 0 }

          # Always write summary
          "## 📊 Test Results - @windows" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| Metric | Value |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "|--------|-------|" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ✅ Passed | $passed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ❌ Failed | $failed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📋 Total | $total |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📈 Pass Rate | ${rate}% |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

          # Exit with failure if tests failed
          if ($failed -gt 0) { exit 1 }
        timeout-minutes: 60
