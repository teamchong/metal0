      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -freference-trace=20

      - name: Run Metal0 Windows-specific tests
        id: test-windows
        shell: pwsh
        run: |
          # Capture output AND exit code
          & .\zig-out\bin\metal0.exe test tests/cpython @windows 2>&1 | Tee-Object -FilePath test_output.txt
          $testExitCode = $LASTEXITCODE

          # Strip ANSI color codes for parsing
          $content = Get-Content test_output.txt -Raw
          if ($null -eq $content) { $content = "" }
          $content = $content -replace '\x1b\[[0-9;]*m', ''

          # Parse results from output
          if ($content -match 'All (\d+) tests passed') {
            $passed = [int]$Matches[1]
            $failed = 0
            $total = $passed
          } elseif ($content -match '(\d+)/(\d+) passed') {
            $passed = [int]$Matches[1]
            $total = [int]$Matches[2]
            $failed = $total - $passed
          } else {
            # Parsing failed - use test exit code as source of truth
            Write-Host "⚠️  Failed to parse test output, using test runner exit code: $testExitCode"
            $passed = 0
            $failed = 1
            $total = 1
            exit $testExitCode
          }

          $rate = if ($total -gt 0) { [math]::Round(($passed / $total) * 100, 1) } else { 0 }

          # Generate summary
          "## 📊 Metal0 Test Results - @windows" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| Metric | Value |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "|--------|-------|" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ✅ Passed | $passed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| ❌ Failed | $failed |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📋 Total | $total |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          "| 📈 Pass Rate | ${rate}% |" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

          # Exit with failure if any tests failed
          if ($failed -gt 0) {
            Write-Host "❌ Tests failed: $failed/$total"
            exit 1
          }
        timeout-minutes: 60

  # =============================================================================
  # CPython Reference Tests (Run local test files with Python interpreter)
  # =============================================================================

  test-cpython-core1:
    name: CPython @core1 (93 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python 3.13.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"

      - name: Run CPython tests (core1)
        run: |
          cd tests/cpython
          # Set locale to C to avoid locale-dependent test failures (e.g., test_datetime %c format)
          export LC_ALL=C
          PASSED=0; FAILED=0; TOTAL=0
          while IFS= read -r test || [ -n "$test" ]; do
            [ -z "$test" ] && continue
            TOTAL=$((TOTAL + 1))
            # Use Python's built-in test module
            # Check output for SUCCESS instead of exit code (some tests return non-zero even when passing)
            OUTPUT=$(python3 -m test test_${test} 2>&1) || true
            echo "$OUTPUT"
            # Match SUCCESS or NO TESTS RAN (skipped tests are not failures)
            if echo "$OUTPUT" | grep -qE "(Tests result: SUCCESS|Result: SUCCESS|Result: NO TESTS RAN)"; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done < ../groups/core1.txt
          RATE=$([ "$TOTAL" -gt 0 ] && echo "scale=1; $PASSED * 100 / $TOTAL" | bc || echo "0")
          echo "## 📊 CPython Test Results - @core1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
